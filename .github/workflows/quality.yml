name: App quality checks
on:
  pull_request:
  push:
    branches: [main, feature/roles-cleaning-guest-verification, "production/**"]
permissions:
  contents: read
jobs:
  hosted-container:
    if: github.head_ref == 'deploy/render-free' || startsWith(github.head_ref, 'security/') || startsWith(github.head_ref, 'production/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag britsmaid-hosted-test .
      - name: Generate synthetic staging secrets
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          keys = ['JWT_SECRET', 'ADMIN_PASSWORD', 'OWNER_PASSWORD', 'CLEANER_PASSWORD', 'SUPERVISOR_PASSWORD']
          Path('.env.staging.local').write_text('\n'.join(key + '=' + secrets.token_urlsafe(36) for key in keys) + '\n')
          PY
      - run: docker compose -f compose.staging.yml up --build --detach --wait --wait-timeout 240
      - run: docker compose -f compose.staging.yml exec -T app python staging_smoke.py
      - if: always()
        run: docker compose -f compose.staging.yml down
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-runtime.txt -r backend/requirements-test.txt
      - run: python -m pytest backend/tests/test_role_security_local.py backend/tests/test_edge_audit_local.py backend/tests/test_camera_training_local.py backend/tests/test_hosted_local.py backend/tests/test_property_photos_local.py backend/tests/test_calendar_photo_release_local.py backend/tests/test_free_security_local.py backend/tests/test_production_services_local.py backend/tests/test_production_load_local.py -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - working-directory: frontend
        run: pnpm typecheck && pnpm lint:check && pnpm test:edges
      - working-directory: frontend
        run: pnpm export:web

      - working-directory: frontend
        run: pnpm exec expo export --platform android --output-dir dist-android
